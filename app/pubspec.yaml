name: datenschild
description: Datenschild – Datenlecks erkennen, verstehen und handeln.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  crypto: ^3.0.5
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.1

# Neuere path_provider_foundation-Versionen ziehen objective_c mit einem nativen
# Build-Hook nach sich, den die Windows-App-Steuerung hier blockiert.
dependency_overrides:
  path_provider_foundation: 2.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/legal/
